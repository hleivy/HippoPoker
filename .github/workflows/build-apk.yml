name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (retry up to 3x)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          for i in 1 2 3; do
            flutter build apk --release 2>&1 | tee build_log.txt && break
            echo "attempt $i failed, retrying in 15s..."; sleep 15
          done

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: poker-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Package APK for public download
        if: steps.build.outcome == 'success'
        run: cp build/app/outputs/flutter-apk/app-release.apk HippoPoker.apk

      - name: Publish APK to public release (no-auth download)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.sha }}
          name: apk-${{ github.sha }}
          files: HippoPoker.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build failure log
        if: steps.build.outcome == 'failure'
        run: tail -n 250 build_log.txt > diag_log.txt || true

      - name: Publish error log on failure
        if: steps.build.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error-${{ github.sha }}
          name: build-error-${{ github.sha }}
          body_path: diag_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
