name: Build Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release web (retry up to 3x)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          for i in 1 2 3; do
            flutter build web --release --base-href "/" 2>&1 | tee build_log.txt && break
            echo "attempt $i failed, retrying in 15s..."; sleep 15
          done

      - name: Upload web artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: poker-web
          path: build/web
          if-no-files-found: error

      - name: Package web for public download
        if: steps.build.outcome == 'success'
        run: cd build/web && zip -r ../../web_release.zip . && cd ../..

      - name: Publish web to public release (no-auth download)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-${{ github.sha }}
          name: web-${{ github.sha }}
          files: web_release.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build failure log
        if: steps.build.outcome == 'failure'
        run: tail -n 250 build_log.txt > diag_log.txt || true

      - name: Publish error log on failure
        if: steps.build.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error-${{ github.sha }}
          name: build-error-${{ github.sha }}
          body_path: diag_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
