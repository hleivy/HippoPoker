name: Build Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release web
        run: flutter build web --release --base-href "/"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: poker-web
          path: build/web
          if-no-files-found: error

      - name: Package web for public download
        run: cd build/web && zip -r ../../web_release.zip . && cd ../..

      - name: Publish web to public release (no-auth download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-web
          name: latest-web
          files: web_release.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
