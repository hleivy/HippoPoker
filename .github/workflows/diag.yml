name: Diagnose Build Error

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (capture output)
        id: build
        continue-on-error: true
        run: set -o pipefail; flutter build web --release --base-href "/" 2>&1 | tee build_log.txt

      - name: Trim log
        if: always()
        run: tail -n 250 build_log.txt > diag_log.txt || true

      - name: Publish error log if failed
        if: steps.build.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-build-log
          name: diag-build-log
          body_path: diag_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
