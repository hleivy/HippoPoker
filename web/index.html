<!DOCTYPE html>
<html>
<head>
  <!-- Flutter 构建时 $FLUTTER_BASE_HREF 会被替换为实际 base-href（此处传 "/"） -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="河马扑克 - 朋友间远程德州扑克">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="河马扑克">
  <!-- 开发测试阶段：禁止浏览器/CDN 缓存 index.html，避免打开时回到旧版本 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>河马扑克</title>
  <link rel="manifest" href="manifest.json?v=0.0.10">
  <link rel="icon" type="image/png" href="favicon.png?v=0.0.10">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=0.0.10">
  <script>
    // 开发测试阶段主动注销旧 Service Worker，防止缓存旧版本（0.0.1 等现象）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) { registration.unregister(); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=0.0.10" async></script>
</head>
<body>
</body>
</html>
